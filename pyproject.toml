[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeram"
version = "0.1.0"
description = "Advanced Roblox Account Manager for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "RAM-Linux Contributors" }
]
keywords = ["roblox", "account-manager", "ram", "linux", "multi-instance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities"
]
dependencies = [
    "PyQt6>=6.4.0",
    "PyQt6-WebEngine>=6.4.0",
    "pynacl>=1.5.0",
    "evdev>=1.6.0",
]

[project.optional-dependencies]
kde = [
    "dbus-python>=1.2.18",
]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
aeram = "core.entrypoint:main"
ram-linux = "core.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
